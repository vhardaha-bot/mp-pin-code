<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MP Pincode खोजें – X Worker</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0d1117;
  --surface: #161b22;
  --surface2: #1c2128;
  --border: #30363d;
  --accent: #25D366;
  --wa-dark: #128C7E;
  --text: #e6edf3;
  --muted: #8b949e;
  --pin: #58a6ff;
  --selected-bg: #1a3a2a;
  --selected-border: #25D366;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  min-height: 100vh;
  padding-bottom: 100px;
}

/* ── Header ── */
header {
  background: var(--surface);
  border-bottom: 2px solid var(--accent);
  padding: 16px;
  text-align: center;
}
.header-logo { font-size: 32px; margin-bottom: 4px; }
.header-title {
  font-size: 22px;
  font-weight: 800;
  color: var(--text);
  letter-spacing: -0.3px;
}
.header-title span { color: var(--accent); }
.header-sub { font-size: 14px; color: var(--muted); margin-top: 4px; }

/* ── Section wrapper ── */
.section {
  max-width: 700px;
  margin: 0 auto;
  padding: 0 14px;
}

/* ── Step label ── */
.step-label {
  font-size: 13px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.8px;
  font-weight: 600;
  margin: 20px 0 10px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.step-num {
  background: var(--accent);
  color: #000;
  font-size: 11px;
  font-weight: 800;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

/* ── District grid ── */
.district-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
.d-btn {
  background: var(--surface);
  border: 1.5px solid var(--border);
  color: var(--text);
  border-radius: 10px;
  padding: 12px 8px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.15s;
  text-align: center;
  line-height: 1.3;
}
.d-btn:hover {
  border-color: var(--accent);
  background: var(--selected-bg);
}
.d-btn.active {
  background: var(--selected-bg);
  border-color: var(--accent);
  color: var(--accent);
  box-shadow: 0 0 0 1px var(--accent);
}

/* ── Search bar (shows after district select) ── */
.search-section { display: none; }
.search-section.visible { display: block; }

.selected-district-bar {
  background: var(--selected-bg);
  border: 1.5px solid var(--accent);
  border-radius: 12px;
  padding: 14px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}
.selected-name {
  font-size: 20px;
  font-weight: 800;
  color: var(--accent);
}
.change-btn {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--muted);
  border-radius: 8px;
  padding: 6px 14px;
  font-size: 13px;
  cursor: pointer;
  font-family: inherit;
}
.change-btn:hover { border-color: var(--accent); color: var(--accent); }

.search-box {
  display: flex;
  align-items: center;
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  margin-bottom: 14px;
}
.search-box:focus-within { border-color: var(--accent); }
.search-box input {
  flex: 1;
  background: transparent;
  border: none;
  outline: none;
  color: var(--text);
  font-size: 17px;
  padding: 14px 16px;
  font-family: inherit;
}
.search-box input::placeholder { color: var(--muted); }
.search-icon { padding: 0 14px; color: var(--muted); font-size: 20px; }

/* ── Results count ── */
.results-count {
  font-size: 13px;
  color: var(--muted);
  margin-bottom: 10px;
}

/* ── Pin list ── */
.pin-list { display: flex; flex-direction: column; gap: 8px; }

.pin-card {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 12px;
  padding: 16px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.pin-card:hover { border-color: #444d56; }

.pin-card-info { flex: 1; min-width: 0; }
.pin-area-name {
  font-size: 18px;
  font-weight: 700;
  color: var(--text);
}
.pin-district-tag {
  font-size: 13px;
  color: var(--muted);
  margin-top: 3px;
}

.pin-code-badge {
  font-size: 20px;
  font-weight: 800;
  color: var(--pin);
  font-family: 'Courier New', monospace;
  letter-spacing: 2px;
  white-space: nowrap;
}

.copy-btn {
  background: var(--surface2);
  border: 1.5px solid var(--border);
  color: var(--muted);
  border-radius: 10px;
  padding: 10px 16px;
  font-size: 14px;
  cursor: pointer;
  font-family: inherit;
  font-weight: 600;
  transition: all 0.15s;
  display: flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
  flex-shrink: 0;
}
.copy-btn:hover { border-color: var(--accent); color: var(--accent); }
.copy-btn.copied {
  background: var(--selected-bg);
  border-color: var(--accent);
  color: var(--accent);
}

/* ── Empty ── */
.empty-state {
  text-align: center;
  padding: 48px 16px;
  color: var(--muted);
}
.empty-state .emoji { font-size: 40px; margin-bottom: 12px; }
.empty-state p { font-size: 16px; }

/* ── WhatsApp Sticky ── */
.wa-sticky {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  z-index: 100;
  padding: 12px 14px 16px;
  background: linear-gradient(to top, #0d1117 70%, transparent);
}
.wa-btn {
  max-width: 700px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  gap: 14px;
  background: #25D366;
  border-radius: 16px;
  padding: 16px 20px;
  text-decoration: none;
  box-shadow: 0 6px 28px rgba(37,211,102,0.35);
  transition: transform 0.15s, box-shadow 0.15s;
}
.wa-btn:active { transform: scale(0.98); }
.wa-logo {
  width: 38px;
  height: 38px;
  flex-shrink: 0;
}
.wa-btn-text { flex: 1; }
.wa-btn-text strong {
  display: block;
  font-size: 16px;
  font-weight: 800;
  color: #000;
  letter-spacing: -0.2px;
}
.wa-btn-text span {
  font-size: 13px;
  color: rgba(0,0,0,0.65);
  font-weight: 500;
}
.wa-arrow {
  font-size: 22px;
  color: #000;
  font-weight: 700;
}

/* ── Toast ── */
.toast {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%) translateY(-20px);
  background: #1a3a2a;
  border: 1px solid var(--accent);
  color: var(--accent);
  padding: 10px 24px;
  border-radius: 24px;
  font-size: 14px;
  font-weight: 600;
  opacity: 0;
  transition: all 0.25s;
  pointer-events: none;
  z-index: 300;
  white-space: nowrap;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

@media (max-width: 400px) {
  .district-grid { grid-template-columns: repeat(2, 1fr); }
  .d-btn { font-size: 14px; padding: 11px 6px; }
}
</style>
</head>

let activeDistrict = null;

// Build district grid
const grid = document.getElementById('districtGrid');
Object.keys(DISTRICTS).forEach(d => {
  const btn = document.createElement('button');
  btn.className = 'd-btn';
  btn.textContent = HINDI[d] || d;
  btn.dataset.key = d;
  btn.onclick = () => selectDistrict(d);
  grid.appendChild(btn);
});

function selectDistrict(d) {
  activeDistrict = d;

  // Highlight button
  document.querySelectorAll('.d-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.key === d);
  });

  // Show search section
  document.getElementById('searchSection').classList.add('visible');
  document.getElementById('selectedDistrictName').textContent = HINDI[d] || d;
  document.getElementById('searchInput').value = '';

  // Scroll to search section smoothly
  document.getElementById('searchSection').scrollIntoView({ behavior: 'smooth', block: 'start' });

  // Focus search
  setTimeout(() => document.getElementById('searchInput').focus(), 400);

  renderPins('');
}

function resetDistrict() {
  activeDistrict = null;
  document.querySelectorAll('.d-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('searchSection').classList.remove('visible');
  document.getElementById('districtSection').scrollIntoView({ behavior: 'smooth' });
}

function renderPins(q) {
  if (!activeDistrict) return;
  const entries = DISTRICTS[activeDistrict] || [];
  const filtered = q
    ? entries.filter(e => e.po.toLowerCase().includes(q) || e.pin.includes(q))
    : entries;

  const countEl = document.getElementById('resultsCount');
  countEl.textContent = `${filtered.length} एरिया मिले`;

  const list = document.getElementById('pinList');
  if (filtered.length === 0) {
    list.innerHTML = `<div class="empty-state"><div class="emoji">🔍</div><p>कोई एरिया नहीं मिला</p></div>`;
    return;
  }

  list.innerHTML = filtered.map(e => `
    <div class="pin-card">
      <div class="pin-card-info">
        <div class="pin-area-name">${e.po}</div>
        <div class="pin-district-tag">📍 ${HINDI[activeDistrict] || activeDistrict}</div>
      </div>
      <div class="pin-code-badge">${e.pin}</div>
      <button class="copy-btn" onclick="copyPin('${e.pin}', this)">📋 Copy</button>
    </div>
  `).join('');
}

document.getElementById('searchInput').addEventListener('input', function() {
  renderPins(this.value.toLowerCase().trim());
});

function copyPin(pin, btn) {
  navigator.clipboard.writeText(pin).then(() => {
    btn.classList.add('copied');
    btn.textContent = '✓ Done';
    showToast();
    setTimeout(() => { btn.classList.remove('copied'); btn.innerHTML = '📋 Copy'; }, 2000);
  }).catch(() => {
    const el = document.createElement('textarea');
    el.value = pin; document.body.appendChild(el); el.select();
    document.execCommand('copy'); document.body.removeChild(el);
    showToast();
  });
}

function showToast() {
  const t = document.getElementById('toast');
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}
